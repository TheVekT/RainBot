{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - RainBot Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'public_web/rake.ico' %}">
    <link rel="stylesheet" href="{% static 'public_web/css/global.css' %}">
    <link rel="stylesheet" href="{% static 'public_web/css/error_pages/error_pages.css' %}">
</head>

<body
    class="min-h-screen text-gray-100 flex flex-col relative overflow-x-hidden selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Decorative Glows -->
    <div class="absolute top-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-indigo-600/10 blur-[120px] pointer-events-none z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-emerald-600/5 blur-[120px] pointer-events-none z-0"></div>

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 bg-gray-950/70 border-b border-gray-800/60 backdrop-blur-md px-4 md:px-6 py-4">
        <div class="w-full flex justify-between items-center">
            <a href="{% url 'public_web:chronology' %}" class="text-xl font-bold tracking-wide flex items-center gap-2 hover:opacity-90 transition">
                <span class="text-2xl">🌧️</span>
                <span class="text-gradient-indigo font-extrabold">RainBot Analytics</span>
            </a>
            <div class="flex items-center gap-1 bg-gray-900/35 p-1 rounded-full border border-gray-800/40">
                <a href="#" class="text-xs font-semibold text-gray-400 hover:text-gray-200 hover:bg-gray-900/40 border border-transparent px-4 py-1.5 rounded-full transition-all">Rains History</a>
                <a href="{% url 'public_web:chronology' %}" class="text-xs font-semibold text-gray-400 hover:text-gray-200 hover:bg-gray-900/40 border border-transparent px-4 py-1.5 rounded-full transition-all">Voice Chronology</a>
                <a href="{% url 'public_web:user_list' %}" class="text-xs font-semibold text-gray-400 hover:text-gray-200 hover:bg-gray-900/40 border border-transparent px-4 py-1.5 rounded-full transition-all">Discord Users</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 z-10">
        <div class="glass-card rounded-2xl p-8 md:p-12 max-w-lg w-full text-center relative overflow-hidden flex flex-col items-center gap-6">
            <!-- Thematic Animated Svg Cloud & Drops -->
            <div class="relative w-24 h-24 flex items-center justify-center mb-2">
                <!-- floating cloud -->
                <svg class="w-20 h-20 text-indigo-400 floating-cloud" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                </svg>
                <!-- raindrops animations -->
                <div class="raindrop" style="left: 25%; top: 65%; animation-delay: 0.1s; animation-duration: 1.2s;"></div>
                <div class="raindrop" style="left: 45%; top: 70%; animation-delay: 0.4s; animation-duration: 1.5s;"></div>
                <div class="raindrop" style="left: 65%; top: 65%; animation-delay: 0.2s; animation-duration: 1.1s;"></div>
                <div class="raindrop" style="left: 80%; top: 75%; animation-delay: 0.7s; animation-duration: 1.4s;"></div>
            </div>

            <div>
                <h1 class="text-7xl md:text-8xl font-black text-gradient-indigo glow-404 tracking-tight leading-none mb-4">404</h1>
                <h2 class="text-xl md:text-2xl font-extrabold text-white tracking-wide mb-2">Lost in the Rain</h2>
                <p class="text-sm text-gray-400 max-w-sm mx-auto">The page you are looking for has evaporated. Let's get you back to the dashboard.</p>
            </div>

        </div>
    </main>
</body>

</html>
